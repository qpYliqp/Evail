<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/images/logos/evail-icon.png" sizes="16x16" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Evail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#a92831',
              secondary: '#620d14',
              travel: '#b58632',
              midnight: '#0f172a',
            },
            fontFamily: {
              display: ['Manrope', 'system-ui', 'sans-serif'],
            },
            boxShadow: {
              glow: '0 20px 45px -25px rgba(169, 40, 49, 0.45)',
            },
            backgroundImage: {
              'glass-pattern':
                'radial-gradient(circle at 20% 20%, rgba(255,255,255,0.15), transparent 60%), radial-gradient(circle at 80% 0%, rgba(169,40,49,0.25), transparent 55%)',
            },
          },
        },
      };
    </script>
  </head>
  <body class="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950 text-white antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
